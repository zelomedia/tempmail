<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyMail – Temporäre E-Mails</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] },
                    colors: {
                        m3: {
                            primary: '#0b57d0',
                            onPrimary: '#ffffff',
                            primaryContainer: '#d3e3fd',
                            onPrimaryContainer: '#041e49',
                            secondaryContainer: '#c2e7ff',
                            onSecondaryContainer: '#001d35',
                            surface: '#f8fafd',
                            surfaceContainer: '#edf2fa',
                            darkSurface: '#0f172a',
                            darkSurfaceContainer: '#1e293b',
                            darkPrimary: '#a8c7fa',
                            darkPrimaryContainer: '#004a77',
                        }
                    },
                    borderRadius: { '4xl': '2rem' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen bg-m3-surface dark:bg-m3-darkSurface text-slate-900 dark:text-slate-100 transition-colors duration-300">
    
    <!-- Header -->
    <header class="sticky top-0 z-30 px-4 h-16 flex items-center justify-between bg-m3-surface dark:bg-m3-darkSurface">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-full bg-m3-primaryContainer dark:bg-m3-darkPrimaryContainer flex items-center justify-center">
                <span class="material-symbols-outlined icon-filled text-m3-onPrimaryContainer dark:text-m3-darkPrimary">mail</span>
            </div>
            <h1 class="font-bold text-xl">ProxyMail</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-black/5">
                <span id="themeIcon" class="material-symbols-outlined">light_mode</span>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-4">

        <!-- Account Card -->
        <div class="bg-m3-surfaceContainer dark:bg-m3-darkSurfaceContainer rounded-[28px] p-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-sm font-medium text-m3-primary uppercase">Deine Adresse</span>
                    <span id="statusBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300">✅ Live</span>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <span id="emailDisplay" class="text-2xl font-medium break-all">Lade...</span>
                    <button onclick="copyEmail()" class="px-4 py-2 rounded-full bg-white dark:bg-slate-800 border hover:bg-slate-50 flex items-center gap-2 text-sm transition">
                        <span class="material-symbols-outlined text-[18px]">content_copy</span> Kopieren
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-1">E-Mails werden automatisch gelöscht</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                <button onclick="generateNewEmail()" class="px-6 py-2.5 rounded-full bg-m3-primary text-white font-medium hover:opacity-90 transition flex items-center justify-center gap-2 shadow-md">
                    <span class="material-symbols-outlined text-[18px]">autorenew</span> Neue Adresse
                </button>
            </div>
        </div>

        <!-- Inbox + Detail -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-[400px]">
            
            <!-- Inbox List -->
            <div class="lg:col-span-5 bg-white dark:bg-m3-darkSurfaceContainer rounded-[28px] border overflow-hidden flex flex-col">
                <div class="p-4 border-b flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined icon-filled text-slate-400">inbox</span>
                        <span class="font-medium">Posteingang</span>
                        <span id="countBadge" class="px-2 py-0.5 rounded-full text-xs bg-m3-primaryContainer text-m3-onPrimaryContainer">0</span>
                    </div>
                    <button onclick="fetchMessages()" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center transition">
                        <span id="refreshSpinner" class="material-symbols-outlined text-[20px]">refresh</span>
                    </button>
                </div>
                <div id="messageList" class="flex-1 overflow-y-auto p-2 max-h-[500px]">
                    <div class="flex flex-col items-center justify-center h-full text-center text-slate-500">
                        <span class="material-symbols-outlined text-5xl mb-2">inbox</span>
                        <p class="text-sm">Keine Nachrichten</p>
                    </div>
                </div>
                <div class="px-4 py-2 border-t text-xs text-slate-500 flex justify-between">
                    <span>🔄 Auto-Update</span>
                    <span id="timerDisplay">10s</span>
                </div>
            </div>

            <!-- Message Detail -->
            <div class="lg:col-span-7 bg-white dark:bg-m3-darkSurfaceContainer rounded-[28px] border overflow-hidden flex flex-col min-h-[300px]">
                <div id="messageDetail" class="flex-1 flex items-center justify-center p-8 text-center text-slate-500">
                    <div>
                        <span class="material-symbols-outlined text-6xl mb-2 text-slate-300">mail</span>
                        <p class="font-medium text-slate-600 dark:text-slate-400">Keine Nachricht ausgewählt</p>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Toast -->
<div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 max-w-sm w-full px-4"></div>

<script>
// ============================================================
// 1. KONFIGURATION
// ============================================================
const API_URL = 'https://www.1secmail.com/api/v1/';
const DOMAINS = ['1secmail.com', '1secmail.org', '1secmail.net'];
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

// ============================================================
// 2. STATE
// ============================================================
let state = {
    address: localStorage.getItem('pm_address') || null,
    messages: [],
    currentId: null,
    countdown: 10,
    isMock: false,
    domains: DOMAINS
};

// ============================================================
// 3. API HELPER
// ============================================================
async function callApi(params) {
    const url = `${API_URL}?${params}`;
    console.log('[API]', url);
    
    try {
        // Direkt
        const res = await fetch(url);
        if (res.ok) {
            const data = await res.json();
            console.log('[API] ✅ Direct', data);
            return data;
        }
    } catch (e) {
        console.warn('[API] Direct failed, trying proxy...', e);
    }
    
    // Proxy
    try {
        const proxyUrl = `${CORS_PROXY}${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
            const data = await res.json();
            console.log('[API] ✅ Proxy', data);
            return data;
        }
    } catch (e) {
        console.error('[API] ❌ Both failed', e);
    }
    
    return null;
}

// ============================================================
// 4. E-MAIL GENERIEREN
// ============================================================
async function generateNewEmail() {
    try {
        // 1secmail: zufällige Adresse generieren
        const data = await callApi('action=genRandomMailbox&count=1');
        
        if (data && Array.isArray(data) && data.length > 0) {
            state.address = data[0];
            localStorage.setItem('pm_address', state.address);
            state.isMock = false;
            state.messages = [];
            state.currentId = null;
            updateUI();
            showToast('✅ Neue Adresse: ' + state.address);
            await fetchMessages();
            return;
        }
        
        // Fallback: manuelle Generierung
        const domain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
        const random = Math.random().toString(36).substring(2, 10);
        state.address = `proxy_${random}@${domain}`;
        localStorage.setItem('pm_address', state.address);
        state.isMock = false;
        state.messages = [];
        state.currentId = null;
        updateUI();
        showToast('✅ Adresse generiert: ' + state.address);
        await fetchMessages();
        
    } catch (err) {
        console.error('Generation failed:', err);
        showToast('❌ Fehler bei Generierung', 'error');
    }
}

// ============================================================
// 5. NACHRICHTEN ABRUFEN
// ============================================================
async function fetchMessages() {
    if (!state.address) {
        console.warn('No address');
        return;
    }
    
    if (state.isMock) {
        renderMessages();
        return;
    }
    
    const [login, domain] = state.address.split('@');
    if (!login || !domain) {
        console.warn('Invalid address:', state.address);
        return;
    }
    
    console.log('[FETCH] login:', login, 'domain:', domain);
    
    // Zeige Lade-Indikator
    document.getElementById('refreshSpinner').classList.add('animate-spin');
    
    try {
        const data = await callApi(`action=getMessages&login=${login}&domain=${domain}`);
        
        if (data && Array.isArray(data)) {
            const oldCount = state.messages.length;
            state.messages = data.map(msg => ({
                id: msg.id,
                from: msg.from || 'Unbekannt',
                subject: msg.subject || '(Kein Betreff)',
                date: msg.date || new Date().toISOString(),
                seen: false
            }));
            
            if (state.messages.length > oldCount) {
                playSound();
                showToast(`📩 ${state.messages.length - oldCount} neue Nachricht(en)`);
            }
            
            renderMessages();
            console.log('[FETCH] ✅', state.messages.length, 'Nachrichten');
        } else {
            state.messages = [];
            renderMessages();
            console.warn('[FETCH] Keine Daten');
        }
    } catch (err) {
        console.error('[FETCH] Fehler:', err);
        state.messages = [];
        renderMessages();
    }
    
    document.getElementById('refreshSpinner').classList.remove('animate-spin');
}

// ============================================================
// 6. NACHRICHT ÖFFNEN
// ============================================================
async function openMessage(id) {
    state.currentId = id;
    renderMessages();
    
    const detailEl = document.getElementById('messageDetail');
    detailEl.innerHTML = `
        <div class="flex items-center justify-center h-full">
            <span class="material-symbols-outlined text-3xl animate-spin text-m3-primary">sync</span>
        </div>
    `;
    
    try {
        const [login, domain] = state.address.split('@');
        const data = await callApi(`action=readMessage&login=${login}&domain=${domain}&id=${id}`);
        
        if (!data || !data.id) {
            throw new Error('Keine Daten');
        }
        
        // Als gelesen markieren
        const target = state.messages.find(m => m.id === id);
        if (target) target.seen = true;
        renderMessages();
        
        const senderInitial = (data.from || '?').charAt(0).toUpperCase();
        const dateStr = data.date ? data.date.replace('T', ' ').substring(0, 19) : 'Unbekannt';
        
        // Für Download
        window.currentText = `Von: ${data.from}\nDatum: ${dateStr}\nBetreff: ${data.subject}\n\n${data.textBody || ''}`;
        
        detailEl.innerHTML = `
            <div class="p-5 border-b">
                <div class="flex justify-between items-start mb-3">
                    <h2 class="text-xl font-medium">${data.subject || '(Kein Betreff)'}</h2>
                    <button onclick="downloadEmail()" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center transition" title="Download">
                        <span class="material-symbols-outlined text-[20px]">download</span>
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-m3-primaryContainer flex items-center justify-center font-bold text-lg">
                        ${senderInitial}
                    </div>
                    <div class="text-sm">
                        <div class="font-medium">${data.from || 'Unbekannt'}</div>
                        <div class="text-slate-500 text-xs">An: ${state.address} • ${dateStr}</div>
                    </div>
                </div>
            </div>
            <div class="p-5 flex-1 overflow-y-auto bg-slate-50/50 dark:bg-black/10">
                ${data.htmlBody ? 
                    `<iframe class="w-full min-h-[300px] border-0 bg-white rounded-xl" srcdoc="${escapeHtml(data.htmlBody)}"></iframe>` :
                    `<pre class="whitespace-pre-wrap font-sans text-sm">${escapeHtml(data.textBody || '')}</pre>`
                }
            </div>
        `;
        
    } catch (err) {
        console.error('Open message failed:', err);
        detailEl.innerHTML = `
            <div class="p-8 text-center text-red-500">
                <p>❌ Fehler beim Laden</p>
                <p class="text-xs mt-2">${err.message}</p>
            </div>
        `;
    }
}

function downloadEmail() {
    if (!window.currentText) return;
    const blob = new Blob([window.currentText], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `email_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
}

// ============================================================
// 7. RENDER
// ============================================================
function renderMessages() {
    const listEl = document.getElementById('messageList');
    const badge = document.getElementById('countBadge');
    badge.textContent = state.messages.length;
    
    if (state.messages.length === 0) {
        listEl.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-center text-slate-500 py-10">
                <span class="material-symbols-outlined text-5xl mb-2">inbox</span>
                <p class="text-sm">Keine Nachrichten</p>
            </div>
        `;
        return;
    }
    
    listEl.innerHTML = state.messages.map(msg => {
        const isSelected = msg.id === state.currentId;
        const isUnread = !msg.seen;
        const initial = (msg.from || '?').charAt(0).toUpperCase();
        let time = '';
        try {
            time = new Date(msg.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        } catch(e) {}
        
        return `
            <div onclick="openMessage('${msg.id}')" class="px-3 py-2.5 mx-1 my-1 rounded-xl cursor-pointer transition-colors ${isSelected ? 'bg-m3-primaryContainer dark:bg-m3-darkPrimaryContainer' : 'hover:bg-slate-50 dark:hover:bg-white/5'} flex items-start gap-3">
                <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-white text-sm ${isUnread ? 'bg-m3-primary' : 'bg-slate-300 dark:bg-slate-700'}">${initial}</div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between gap-2">
                        <span class="text-sm font-medium truncate ${isUnread ? 'text-slate-900 dark:text-white' : 'text-slate-600'}">${msg.from || 'Unbekannt'}</span>
                        <span class="text-xs text-slate-500 flex-shrink-0">${time}</span>
                    </div>
                    <div class="text-sm truncate ${isUnread ? 'font-medium' : 'text-slate-500'}">${msg.subject || '(Kein Betreff)'}</div>
                </div>
            </div>
        `;
    }).join('');
}

function updateUI() {
    const display = document.getElementById('emailDisplay');
    if (display && state.address) {
        display.textContent = state.address;
    }
    renderMessages();
}

// ============================================================
// 8. TOAST
// ============================================================
function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-8 opacity-0 ${type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-800'}`;
    toast.textContent = msg;
    container.appendChild(toast);
    
    requestAnimationFrame(() => {
        toast.classList.remove('translate-y-8', 'opacity-0');
    });
    
    setTimeout(() => {
        toast.classList.add('translate-y-8', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================================
// 9. COPY
// ============================================================
async function copyEmail() {
    if (!state.address) return;
    try {
        await navigator.clipboard.writeText(state.address);
        showToast('✅ Kopiert!');
    } catch {
        const ta = document.createElement('textarea');
        ta.value = state.address;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ Kopiert!');
    }
}

// ============================================================
// 10. SOUND
// ============================================================
function playSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

// ============================================================
// 11. THEME
// ============================================================
function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.theme = isDark ? 'dark' : 'light';
    document.getElementById('themeIcon').textContent = isDark ? 'dark_mode' : 'light_mode';
}

function initTheme() {
    const isDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').textContent = 'dark_mode';
    }
}

// ============================================================
// 12. HELPER
// ============================================================
function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============================================================
// 13. TIMER
// ============================================================
setInterval(() => {
    state.countdown--;
    const timer = document.getElementById('timerDisplay');
    if (timer) timer.textContent = `${state.countdown}s`;
    if (state.countdown <= 0) {
        state.countdown = 10;
        fetchMessages();
    }
}, 1000);

// ============================================================
// 14. INIT
// ============================================================
window.onload = function() {
    initTheme();
    
    // Alte mail.tm-Daten löschen
    localStorage.removeItem('pm_token');
    localStorage.removeItem('pm_password');
    localStorage.removeItem('pm_id');
    
    if (state.address && !state.address.includes('mail.tm')) {
        updateUI();
        fetchMessages();
    } else {
        // Falls noch mail.tm-Adresse, neue generieren
        generateNewEmail();
    }
};
</script>
</body>
</html>
