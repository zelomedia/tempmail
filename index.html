<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyMail – Temporäre E-Mails</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'] },
                    colors: {
                        primary: '#0b57d0',
                        primaryContainer: '#d3e3fd',
                        surface: '#f8fafd',
                        darkSurface: '#0f172a'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen bg-surface dark:bg-darkSurface text-slate-900 dark:text-slate-100">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-surface dark:bg-darkSurface px-4 h-16 flex items-center justify-between border-b">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">mail</span>
            <h1 class="font-bold text-xl">ProxyMail</h1>
        </div>
        <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800">
            <span id="themeIcon" class="material-symbols-outlined">dark_mode</span>
        </button>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- Status -->
        <div class="flex items-center gap-3 mb-4">
            <span id="statusDot" class="w-3 h-3 rounded-full bg-red-500"></span>
            <span id="statusText" class="text-sm font-medium text-red-500">Offline</span>
            <span id="emailDisplay" class="text-sm font-mono bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full truncate max-w-[300px]">Keine Adresse</span>
        </div>

        <!-- Actions -->
        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="generateNewEmail()" class="px-6 py-2.5 rounded-full bg-primary text-white font-medium hover:opacity-90 transition flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">autorenew</span> Neue Adresse
            </button>
            <button onclick="copyEmail()" class="px-6 py-2.5 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">content_copy</span> Kopieren
            </button>
            <button onclick="fetchMessages()" class="px-6 py-2.5 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">refresh</span> Aktualisieren
            </button>
        </div>

        <!-- Inbox -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <!-- Liste -->
            <div class="md:col-span-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <span class="font-medium">Posteingang</span>
                    <span id="countBadge" class="px-2 py-0.5 rounded-full bg-primary/10 text-primary text-xs font-bold">0</span>
                </div>
                <div id="messageList" class="h-[400px] overflow-y-auto p-2">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400">
                        <span class="material-symbols-outlined text-5xl">inbox</span>
                        <p class="text-sm mt-2">Keine Nachrichten</p>
                    </div>
                </div>
            </div>

            <!-- Detail -->
            <div class="md:col-span-7 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div id="detailView" class="h-[400px] flex flex-col items-center justify-center text-slate-400 p-6">
                    <span class="material-symbols-outlined text-5xl">mail</span>
                    <p class="text-sm mt-2">Wähle eine Nachricht</p>
                </div>
            </div>
        </div>

        <!-- Auto-Refresh Info -->
        <div class="mt-4 text-xs text-slate-400 flex justify-between">
            <span>🔄 Auto-Update alle <span id="timerDisplay">10</span>s</span>
            <span id="apiInfo">Wird geladen...</span>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-800 px-6 py-3 rounded-2xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <span id="toastMsg">Nachricht</span>
    </div>

    <script>
        // ============================================================
        // 1. KONFIGURATION
        // ============================================================
        const API = 'https://api.mail.tm';

        // ============================================================
        // 2. STATE
        // ============================================================
        let state = {
            token: localStorage.getItem('pm_token') || null,
            address: localStorage.getItem('pm_address') || null,
            id: localStorage.getItem('pm_id') || null,
            password: localStorage.getItem('pm_password') || null,
            messages: [],
            currentId: null,
            countdown: 10,
            isLive: false
        };

        // ============================================================
        // 3. TOAST
        // ============================================================
        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 pointer-events-auto ${type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-800'}`;
            setTimeout(() => {
                el.className = el.className.replace('translate-y-0 opacity-100', 'translate-y-20 opacity-0');
            }, 3000);
        }

        // ============================================================
        // 4. STATUS
        // ============================================================
        function setStatus(live) {
            state.isLive = live;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (live) {
                dot.className = 'w-3 h-3 rounded-full bg-green-500';
                text.className = 'text-sm font-medium text-green-500';
                text.textContent = 'Live';
            } else {
                dot.className = 'w-3 h-3 rounded-full bg-red-500';
                text.className = 'text-sm font-medium text-red-500';
                text.textContent = 'Offline';
            }
        }

        function updateUI() {
            const display = document.getElementById('emailDisplay');
            display.textContent = state.address || 'Keine Adresse';
            renderMessages();
            setStatus(state.isLive);
        }

        // ============================================================
        // 5. THEME
        // ============================================================
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('themeIcon').textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        function initTheme() {
            const isDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').textContent = 'light_mode';
            }
        }

        // ============================================================
        // 6. API CALLS
        // ============================================================
        async function apiFetch(endpoint, options = {}) {
            const url = `${API}${endpoint}`;
            const res = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(state.token ? { 'Authorization': `Bearer ${state.token}` } : {}),
                    ...options.headers
                }
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || err.message || `HTTP ${res.status}`);
            }
            return res.json();
        }

        // ============================================================
        // 7. ACCOUNT ERSTELLEN
        // ============================================================
        async function createAccount() {
            try {
                // Domains abrufen
                const domains = await apiFetch('/domains');
                const domainList = domains['hydra:member'] || [{ domain: 'mail.tm' }];
                const domain = domainList[Math.floor(Math.random() * domainList.length)].domain;
                
                const randomStr = Math.random().toString(36).substring(2, 10);
                const address = `pm_${randomStr}@${domain}`;
                const password = Math.random().toString(36).slice(-12) + 'A1!';

                // Account erstellen
                await apiFetch('/accounts', {
                    method: 'POST',
                    body: JSON.stringify({ address, password })
                });

                // Token holen
                const tokenData = await apiFetch('/token', {
                    method: 'POST',
                    body: JSON.stringify({ address, password })
                });

                state.token = tokenData.token;
                state.address = address;
                state.id = tokenData.id;
                state.password = password;

                localStorage.setItem('pm_token', state.token);
                localStorage.setItem('pm_address', state.address);
                localStorage.setItem('pm_id', state.id);
                localStorage.setItem('pm_password', state.password);

                state.isLive = true;
                updateUI();
                showToast(`✅ ${address}`);

                // Willkommensnachricht (lokal)
                addWelcomeMessage();

                // E-Mails abrufen
                await fetchMessages();

                return true;
            } catch (err) {
                console.error('[CREATE] Fehler:', err);
                showToast('❌ ' + err.message, 'error');
                state.isLive = false;
                setStatus(false);
                return false;
            }
        }

        // ============================================================
        // 8. WILLKOMMENSNACHRICHT (Lokal)
        // ============================================================
        function addWelcomeMessage() {
            const welcome = {
                id: 'welcome_' + Date.now(),
                from: { address: 'hello@proxymail.local', name: 'ProxyMail Team' },
                subject: '🎉 Willkommen bei ProxyMail!',
                createdAt: new Date().toISOString(),
                intro: 'Deine temporäre E-Mail-Adresse ist bereit.',
                text: 'Hallo!\n\nDeine temporäre E-Mail-Adresse ist einsatzbereit.\n\n✅ E-Mails werden automatisch abgerufen\n✅ Nach 7 Tagen gelöscht\n✅ Keine Registrierung nötig\n\nViel Spaß mit ProxyMail!\n\n- Dein ProxyMail Team',
                isWelcome: true
            };
            state.messages = [welcome, ...state.messages];
            renderMessages();
            document.getElementById('countBadge').textContent = state.messages.length;
            showToast('📩 Willkommensnachricht erhalten');
        }

        // ============================================================
        // 9. NEUE ADRESSE
        // ============================================================
        async function generateNewEmail() {
            document.getElementById('statusText').textContent = 'Wird erstellt...';
            await createAccount();
        }

        // ============================================================
        // 10. NACHRICHTEN ABRUFEN
        // ============================================================
        async function fetchMessages() {
            if (!state.token || !state.address) {
                console.warn('Kein Token/Adresse');
                return;
            }

            try {
                const data = await apiFetch('/messages');
                const newMessages = data['hydra:member'] || [];

                // Seen-Status erhalten
                const seenMap = {};
                state.messages.forEach(m => { if (m.id && !m.isWelcome) seenMap[m.id] = m.seen; });

                const mapped = newMessages.map(msg => ({
                    ...msg,
                    seen: seenMap[msg.id] || false
                }));

                // Willkommensnachricht erhalten
                const welcomeMsg = state.messages.find(m => m.isWelcome);
                state.messages = welcomeMsg ? [welcomeMsg, ...mapped] : mapped;

                state.isLive = true;
                setStatus(true);
                renderMessages();
                document.getElementById('countBadge').textContent = state.messages.length;

                if (mapped.length > 0) {
                    showToast(`📩 ${mapped.length} Nachricht(en)`);
                }

                document.getElementById('apiInfo').textContent = `Letzte Aktualisierung: ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                console.error('[FETCH] Fehler:', err);
                state.isLive = false;
                setStatus(false);
                // Wenn Token abgelaufen, neue Adresse generieren
                if (err.message.includes('401') || err.message.includes('JWT')) {
                    showToast('Token abgelaufen – neue Adresse wird erstellt...', 'error');
                    await generateNewEmail();
                }
            }
        }

        // ============================================================
        // 11. NACHRICHT ÖFFNEN
        // ============================================================
        async function openMessage(id) {
            if (id.startsWith('welcome_')) {
                const msg = state.messages.find(m => m.id === id);
                if (msg) {
                    renderDetail(msg);
                    state.currentId = id;
                    renderMessages();
                }
                return;
            }

            state.currentId = id;
            renderMessages();

            try {
                const msg = await apiFetch(`/messages/${id}`);
                renderDetail(msg);

                // Als gelesen markieren
                const target = state.messages.find(m => m.id === id);
                if (target) target.seen = true;
                renderMessages();

            } catch (err) {
                console.error('[OPEN] Fehler:', err);
                showToast('❌ Nachricht konnte nicht geladen werden', 'error');
            }
        }

        function renderDetail(msg) {
            const el = document.getElementById('detailView');
            const from = msg.from?.address || msg.from?.name || 'Unbekannt';
            const fromName = msg.from?.name || from;
            const date = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : 'Unbekannt';
            const initial = fromName.charAt(0).toUpperCase();

            el.innerHTML = `
                <div class="w-full h-full flex flex-col">
                    <div class="p-4 border-b border-slate-200 dark:border-slate-800">
                        <h2 class="text-xl font-bold">${msg.subject || '(Kein Betreff)'}</h2>
                        <div class="flex items-center gap-3 mt-3">
                            <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center font-bold text-primary">${initial}</div>
                            <div>
                                <div class="font-medium">${fromName}</div>
                                <div class="text-xs text-slate-400">${date}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-4 bg-slate-50 dark:bg-slate-800/50">
                        ${msg.html ? 
                            `<iframe class="w-full h-full min-h-[200px] bg-white dark:bg-slate-900 rounded-lg border-0" srcdoc="${msg.html.replace(/"/g, '&quot;')}"></iframe>` :
                            `<pre class="whitespace-pre-wrap font-sans text-sm">${msg.text || 'Kein Inhalt'}</pre>`
                        }
                    </div>
                </div>
            `;
        }

        // ============================================================
        // 12. RENDER MESSAGES
        // ============================================================
        function renderMessages() {
            const list = document.getElementById('messageList');
            const badge = document.getElementById('countBadge');

            if (state.messages.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400">
                        <span class="material-symbols-outlined text-5xl">inbox</span>
                        <p class="text-sm mt-2">Keine Nachrichten</p>
                    </div>
                `;
                badge.textContent = '0';
                return;
            }

            badge.textContent = state.messages.length;

            list.innerHTML = state.messages.map(msg => {
                const isSelected = msg.id === state.currentId;
                const isUnread = !msg.seen && !msg.isWelcome;
                const from = msg.from?.name || msg.from?.address || 'Unbekannt';
                const initial = from.charAt(0).toUpperCase();
                const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                return `
                    <div onclick="openMessage('${msg.id}')" class="px-3 py-2.5 mx-1 my-1 rounded-xl cursor-pointer transition-colors ${isSelected ? 'bg-primary/10' : 'hover:bg-slate-100 dark:hover:bg-slate-800'} flex items-start gap-3">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-white text-sm ${isUnread ? 'bg-primary' : 'bg-slate-300 dark:bg-slate-700'}">${initial}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between gap-2">
                                <span class="text-sm font-medium truncate ${isUnread ? 'text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-400'}">${from}</span>
                                <span class="text-xs text-slate-400 flex-shrink-0">${time}</span>
                            </div>
                            <div class="text-sm truncate ${isUnread ? 'font-medium' : 'text-slate-500'}">${msg.subject || '(Kein Betreff)'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // 13. COPY
        // ============================================================
        async function copyEmail() {
            if (!state.address) {
                showToast('❌ Keine Adresse zum Kopieren', 'error');
                return;
            }
            try {
                await navigator.clipboard.writeText(state.address);
                showToast('✅ Kopiert!');
            } catch {
                const ta = document.createElement('textarea');
                ta.value = state.address;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ Kopiert!');
            }
        }

        // ============================================================
        // 14. AUTO-UPDATE
        // ============================================================
        setInterval(() => {
            state.countdown--;
            document.getElementById('timerDisplay').textContent = state.countdown;
            if (state.countdown <= 0) {
                state.countdown = 10;
                fetchMessages();
            }
        }, 1000);

        // ============================================================
        // 15. INIT
        // ============================================================
        window.onload = async function() {
            initTheme();
            setStatus(false);
            document.getElementById('apiInfo').textContent = 'Initialisiere...';

            // Prüfe ob vorhandene Session gültig ist
            if (state.token && state.address) {
                updateUI();
                try {
                    await fetchMessages();
                } catch {
                    // Wenn Fehler, neue Adresse
                    await generateNewEmail();
                }
            } else {
                // Neue Adresse erstellen
                await generateNewEmail();
            }
        };
    </script>
</body>
</html>
